[package]
repository = "https://github.com/kiko-love/openMoonvy-mcp-rs"
license = "MIT"
description = "Moonvy design extraction MCP server (Rust, pure API)"
name = "openmoonvy-mcp-rs"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "6.0.0"
flate2 = "1.1.9"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
rmcp = { version = "3.1.2", features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.26"
url = "2.5.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
